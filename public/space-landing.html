<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond Stage Zero · .space</title>
    <meta name="description" content="Beyond Stage Zero." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100svh;
        min-height: 100dvh;
        background: #0a0a0c;
        color: #fafaf7;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: rgba(255, 87, 34, 0.4);
        color: #fafaf7;
      }

      .space-landing {
        min-height: 100svh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .space-landing-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: clamp(1.25rem, 3vw, 2rem);
        animation: space-rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        max-width: 36rem;
        width: 100%;
      }

      .space-mark {
        width: auto;
        height: clamp(48px, 9vw, 72px);
        color: #fafaf7;
        animation: space-fade 900ms ease both;
      }

      .space-wordmark {
        margin: 0;
        font-size: clamp(0.875rem, 2.2vw, 1.125rem);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fafaf7;
        animation: space-fade 900ms ease 120ms both;
      }

      .space-wordmark span {
        font-weight: 400;
        opacity: 0.9;
      }

      .space-domain {
        margin: 0;
        font-size: clamp(3.5rem, 14vw, 8.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.9;
        color: #ff5722;
        animation: space-fade 1000ms ease 220ms both;
      }

      .space-teaser {
        margin: 0;
        max-width: 28rem;
        font-size: clamp(0.875rem, 2.2vw, 1.125rem);
        font-weight: 400;
        letter-spacing: 0.14em;
        line-height: 1.5;
        text-transform: uppercase;
        color: #fafaf7;
        animation: space-fade 1000ms ease 380ms both;
      }

      @keyframes space-rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes space-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .space-landing-inner,
        .space-mark,
        .space-wordmark,
        .space-domain,
        .space-teaser {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="space-landing">
      <div class="space-landing-inner">
        <svg
          class="space-mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 120 120"
          aria-hidden="true"
        >
          <circle cx="25.6" cy="60" r="18" fill="currentColor" />
          <path d="M45.1 23 L55.1 23 L55.1 97 L45.1 97" fill="none" stroke="currentColor" stroke-width="9" />
          <line x1="70.7" y1="82" x2="90.7" y2="38" stroke="currentColor" stroke-width="9" />
          <line x1="88.3" y1="82" x2="108.3" y2="38" stroke="currentColor" stroke-width="9" />
        </svg>
        <p class="space-wordmark">BEYOND <span>[STAGE ZERO]</span></p>
        <h1 class="space-domain">.space</h1>
        <p class="space-teaser">Live mission tracking coming soon</p>
      </div>
    </main>
  </body>
</html>
