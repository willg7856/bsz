<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live · Beyond Stage Zero</title>
    <meta name="description" content="Follow Beyond Stage Zero's rocket tests live — countdown, livestream and updates from the range." />
    <meta property="og:title" content="Beyond Stage Zero · Live" />
    <meta property="og:description" content="Follow our rocket tests live — countdown, livestream and updates from the range." />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07080a;
        --panel: #0e1013;
        --line: rgba(250, 250, 247, 0.1);
        --line-strong: rgba(250, 250, 247, 0.18);
        --fg: #fafaf7;
        --muted: #9aa3ad;
        --orange: #ff5a1f;
        --amber: #ffc400;
        --red: #ff4d4d;
        --green: #3ccf7f;
        --cyan: #2dc2d9;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        color-scheme: dark;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; }
      body { min-height: 100svh; background: var(--bg); color: var(--fg); font-family: var(--mono); -webkit-font-smoothing: antialiased; }
      body::before {
        content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background-image: linear-gradient(rgba(250, 250, 247, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(250, 250, 247, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 80%);
      }
      a { color: inherit; }
      ::selection { background: rgba(255, 90, 31, 0.4); }
      .wrap { width: min(1180px, 100%); margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }

      /* header */
      .top { border-bottom: 1px solid var(--line); }
      .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; letter-spacing: 0.14em; font-size: 13px; }
      .brand svg { width: 28px; height: 28px; }
      .brand b { color: var(--orange); font-weight: 700; }
      .top-link { font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: 0.06em; }
      .top-link:hover { color: var(--fg); }

      /* status + hero */
      main.wrap { padding-top: clamp(24px, 5vw, 48px); padding-bottom: 64px; }
      .kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; font-weight: 700; color: #07080a; background: var(--muted); letter-spacing: 0.16em; }
      .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .pill.live { background: var(--red); color: #fff; }
      .pill.hold { background: var(--amber); }
      .pill.done { background: var(--green); }
      .pill.scheduled { background: var(--fg); }
      .pill.live::before, .pill.hold::before { animation: pulse 1.6s ease-out infinite; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 5.4vw, 56px); line-height: 1.04; letter-spacing: -0.03em; text-transform: uppercase; }
      .clock { margin: 0; font-size: clamp(44px, 11vw, 120px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .clock .t { color: var(--orange); margin-right: 0.18em; }
      .clock .u { font-size: 0.4em; color: var(--muted); margin: 0 0.3em 0 0.04em; }
      .clock.small { font-size: clamp(28px, 6vw, 48px); }
      .when { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
      .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

      /* stream */
      .stream { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
      .stream iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .stream-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 20px; border: 1px solid var(--line); background: var(--panel); }
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; background: var(--orange); color: #0b0d0f; font-weight: 700; text-decoration: none; letter-spacing: 0.04em; font-size: 14px; }
      .btn:hover { filter: brightness(1.08); }
      .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }

      /* layout */
      .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px; margin-top: 36px; align-items: start; }
      .panel { border: 1px solid var(--line); background: var(--panel); }
      .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      .panel-body { padding: 6px 18px 14px; }
      .fresh { font-size: 11px; letter-spacing: 0.08em; text-transform: none; }
      .fresh.stale { color: var(--amber); }

      /* updates */
      .updates { list-style: none; margin: 0; padding: 0; }
      .updates li { display: grid; grid-template-columns: 7.5em 6.5em minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
      .updates li:first-child { border-top: 0; }
      .updates li.new { animation: flash 2.4s ease-out; }
      @keyframes flash { 0% { background: rgba(255, 90, 31, 0.18); } 100% { background: transparent; } }
      .u-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .u-kind { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .u-kind.go { color: var(--green); }
      .u-kind.hold { color: var(--amber); }
      .u-kind.milestone { color: var(--orange); }
      .u-kind.result { color: var(--cyan); }
      .u-text { font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
      .empty { color: var(--muted); font-size: 14px; padding: 12px 0; margin: 0; }
      .result { margin: 0 0 6px; padding: 16px 18px; border-left: 3px solid var(--green); background: rgba(60, 207, 127, 0.07); font-size: 15px; line-height: 1.55; white-space: pre-wrap; }

      /* side lists */
      .side { display: flex; flex-direction: column; gap: 20px; }
      .list { list-style: none; margin: 0; padding: 0; }
      .list li { padding: 12px 0; border-top: 1px solid var(--line); }
      .list li:first-child { border-top: 0; }
      .list .name { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: -0.01em; }
      .list .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
      .list .res { font-size: 13px; color: #c9ced4; margin-top: 6px; line-height: 1.45; }
      .list .clock.mini { font-size: 18px; margin-top: 4px; }

      footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
      footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 20px; }
      footer a { color: var(--fg); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      @media (max-width: 860px) {
        .grid { grid-template-columns: minmax(0, 1fr); }
        .updates li { grid-template-columns: 6.5em minmax(0, 1fr); }
        .u-kind { grid-column: 2; grid-row: 1; }
        .u-text { grid-column: 1 / -1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pill::before, .updates li.new { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="brand" href="https://beyondstagezero.com" aria-label="Beyond Stage Zero">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="25.6" cy="60" r="18" fill="currentColor" />
            <path d="M45.1 23 L55.1 23 L55.1 97 L45.1 97" fill="none" stroke="currentColor" stroke-width="9" />
            <line x1="70.7" y1="82" x2="90.7" y2="38" stroke="currentColor" stroke-width="9" />
            <line x1="88.3" y1="82" x2="108.3" y2="38" stroke="currentColor" stroke-width="9" />
          </svg>
          <span>BEYOND STAGE ZERO <b>· LIVE</b></span>
        </a>
        <a class="top-link" href="https://beyondstagezero.com/tests">Test log →</a>
      </div>
    </header>

    <main class="wrap" id="app" aria-busy="true">
      <p class="empty">Connecting to the range…</p>
    </main>

    <footer>
      <div class="wrap">
        <span>Times shown in Melbourne time (Creswick, VIC).</span>
        <span><a href="https://beyondstagezero.com/news">News</a> · <a href="https://beyondstagezero.com">beyondstagezero.com</a></span>
      </div>
    </footer>

    <script>
      (function () {
        // Live data comes from Octopus, the team's ops hub. On localhost, ?octopus=<url> points elsewhere for testing.
        var params = new URLSearchParams(location.search)
        var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
        var FEED = ((isLocal && params.get('octopus')) || 'https://ops.beyondstagezero.com') + '/api/public/live'
        var TZ = 'Australia/Melbourne'
        var POLL_MS = 10000
        var app = document.getElementById('app')
        var data = null
        var lastOk = 0
        var seen = new Set()
        var firstRender = true

        var STATUS = { scheduled: 'Scheduled', hold: 'Hold', live: 'Live', done: 'Complete', scrubbed: 'Scrubbed' }
        var KIND = { test: 'Test', launch: 'Launch' }

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
          })
        }
        function pad(n) { return (n < 10 ? '0' : '') + n }

        function clockHtml(target, cls) {
          return '<p class="clock ' + (cls || '') + '" data-at="' + target + '">' + clockInner(target) + '</p>'
        }
        function clockInner(target) {
          var diff = target - Date.now()
          var s = Math.floor(Math.abs(diff) / 1000)
          var d = Math.floor(s / 86400)
          s -= d * 86400
          var hms = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60)
          return '<span class="t">T' + (diff >= 0 ? '−' : '+') + '</span>' + (d ? d + '<span class="u">d</span>' : '') + hms
        }

        function whenText(iso, hasTime) {
          var dt = new Date(iso)
          var day = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(dt)
          if (!hasTime) return day
          var t = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short' }).format(dt)
          return day + ' · ' + t.replace(/\s?([ap])m/i, function (_, x) { return ' ' + x.toLowerCase() + 'm' })
        }
        function shortDate(iso) {
          return new Intl.DateTimeFormat('en-AU', { timeZone: TZ, day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(iso))
        }
        function timeOfDay(iso) {
          return new Intl.DateTimeFormat('en-AU', { timeZone: TZ, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })
            .format(new Date(iso)).replace(/\s?([ap])m/i, function (_, x) { return ' ' + x.toLowerCase() + 'm' })
        }

        // YouTube links play inline; anything else gets a button.
        function youtubeId(url) {
          try {
            var u = new URL(url)
            var host = u.hostname.replace(/^www\.|^m\./, '')
            if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0]
            if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
              if (u.searchParams.get('v')) return u.searchParams.get('v')
              var m = u.pathname.match(/^\/(live|embed|shorts)\/([\w-]{6,})/)
              if (m) return m[2]
            }
          } catch (e) {}
          return null
        }
        function streamHtml(t) {
          if (!t.stream) {
            if (t.status === 'live' || t.status === 'hold') {
              return '<div class="stream-cta"><span>No livestream for this one — follow the updates below.</span></div>'
            }
            return ''
          }
          var id = youtubeId(t.stream)
          if (id && /^[\w-]+$/.test(id)) {
            return '<div class="stream"><iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1" title="Livestream" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>'
          }
          var over = t.status === 'done' || t.status === 'scrubbed'
          return '<div class="stream-cta"><span>' + (over ? 'Watch the replay' : 'Watch the livestream') + '</span><a class="btn" href="' + esc(t.stream) + '" target="_blank" rel="noopener">' + (over ? 'Watch →' : 'Watch live →') + '</a></div>'
        }

        function render() {
          app.removeAttribute('aria-busy')
          if (!data) return
          var c = data.current
          var html = ''
          if (c) {
            var status = STATUS[c.status] ? c.status : 'scheduled'
            var countable = status === 'scheduled' || status === 'hold' || status === 'live'
            html += '<section class="hero">'
            html += '<div>'
            html += '<p class="kicker"><span class="pill ' + status + '">' + STATUS[status] + '</span><span>' + (KIND[c.kind] || 'Test') + '</span></p>'
            html += '<h1>' + esc(c.name) + '</h1>'
            if (countable) html += clockHtml(Date.parse(c.at))
            html += '<p class="when">' + esc(whenText(c.at, !!c.time)) + '</p>'
            html += '</div>'
            html += streamHtml(c)
            html += '</section>'

            html += '<div class="grid"><section class="panel" aria-labelledby="upd">'
            html += '<div class="panel-head"><span id="upd">Live updates</span><span class="fresh" id="fresh"></span></div>'
            html += '<div class="panel-body">'
            if (c.result && (status === 'done' || status === 'scrubbed')) html += '<p class="result">' + esc(c.result) + '</p>'
            if (c.updates.length) {
              html += '<ul class="updates" aria-live="polite">'
              c.updates.forEach(function (u) {
                var key = u.at + '|' + u.text
                var isNew = !firstRender && !seen.has(key)
                seen.add(key)
                html += '<li class="' + (isNew ? 'new' : '') + '"><span class="u-time">' + esc(timeOfDay(u.at)) + '</span><span class="u-kind ' + esc(u.kind) + '">' + esc(u.kind) + '</span><span class="u-text">' + esc(u.text) + '</span></li>'
              })
              html += '</ul>'
            } else {
              html += '<p class="empty">Updates from the range will appear here on the day.</p>'
            }
            html += '</div></section>'
            html += sideHtml()
            html += '</div>'
          } else {
            html += '<section class="hero"><div>'
            html += '<p class="kicker"><span class="pill">Standby</span></p>'
            html += '<h1>No test scheduled right now.</h1>'
            html += '<p class="when">When the next one is booked, the countdown, livestream and updates from the range will be right here.</p>'
            html += '<p style="margin-top:20px"><a class="btn ghost" href="https://beyondstagezero.com/news">Latest news →</a></p>'
            html += '</div></section>'
            if (data.recent.length || data.next.length) html += '<div class="grid"><div></div>' + sideHtml() + '</div>'
          }
          app.innerHTML = html
          firstRender = false
          updateFresh()
        }

        function sideHtml() {
          var html = '<aside class="side">'
          if (data.next.length) {
            html += '<section class="panel"><div class="panel-head"><span>Next up</span></div><div class="panel-body"><ul class="list">'
            data.next.forEach(function (t) {
              html += '<li><div class="name">' + esc(t.name) + '</div><div class="meta">' + esc(whenText(t.at, !!t.time)) + '</div>' + clockHtml(Date.parse(t.at), 'mini') + '</li>'
            })
            html += '</ul></div></section>'
          }
          if (data.recent.length) {
            html += '<section class="panel"><div class="panel-head"><span>Recent tests</span></div><div class="panel-body"><ul class="list">'
            data.recent.forEach(function (t) {
              html += '<li><div class="name">' + esc(t.name) + '</div><div class="meta">' + esc(shortDate(t.at)) + ' · ' + (STATUS[t.status] || '') + '</div>' + (t.result ? '<div class="res">' + esc(t.result) + '</div>' : '') + '</li>'
            })
            html += '</ul></div></section>'
          }
          return html + '</aside>'
        }

        function tick() {
          var clocks = app.querySelectorAll('.clock[data-at]')
          for (var i = 0; i < clocks.length; i++) clocks[i].innerHTML = clockInner(Number(clocks[i].getAttribute('data-at')))
          updateFresh()
        }

        function updateFresh() {
          var el = document.getElementById('fresh')
          if (!el || !lastOk) return
          var ago = Math.round((Date.now() - lastOk) / 1000)
          var stale = ago > 45
          el.className = 'fresh' + (stale ? ' stale' : '')
          el.textContent = stale ? 'Reconnecting…' : ago < 5 ? 'Live · just updated' : 'Live · updated ' + ago + 's ago'
        }

        function load() {
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null
          var timer = setTimeout(function () { ctrl && ctrl.abort() }, 8000)
          fetch(FEED, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (next) {
              if (!next) return
              lastOk = Date.now()
              var changed = JSON.stringify(next.current) + JSON.stringify(next.next) + JSON.stringify(next.recent)
              var before = data ? JSON.stringify(data.current) + JSON.stringify(data.next) + JSON.stringify(data.recent) : ''
              data = next
              if (changed !== before) render()
              document.title = (data.current && data.current.status === 'live' ? '● LIVE · ' : '') + (data.current ? data.current.name + ' · ' : '') + 'Beyond Stage Zero'
            })
            .catch(function () {
              if (!data) app.innerHTML = '<p class="empty">Can’t reach the range right now — retrying…</p>'
            })
            .finally(function () { clearTimeout(timer) })
        }

        load()
        setInterval(function () { if (document.visibilityState === 'visible') load() }, POLL_MS)
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load() })
        setInterval(tick, 1000)
      })()
    </script>
  </body>
</html>
