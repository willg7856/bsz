<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#3a3a3a"/>
  <!-- Subtle gear watermark -->
  <g opacity="0.08" fill="#fff" transform="translate(100,100)">
    <circle r="55" fill="none" stroke="#fff" stroke-width="6"/>
    <circle r="38" fill="none" stroke="#fff" stroke-width="3"/>
    <circle r="12" fill="#fff"/>
    <!-- Gear teeth -->
    <rect x="-7" y="-65" width="14" height="20" rx="2"/>
    <rect x="-7" y="45"  width="14" height="20" rx="2"/>
    <rect x="-65" y="-7" width="20" height="14" rx="2"/>
    <rect x="45"  y="-7" width="20" height="14" rx="2"/>
    <g transform="rotate(45)">
      <rect x="-7" y="-65" width="14" height="20" rx="2"/>
      <rect x="-7" y="45"  width="14" height="20" rx="2"/>
      <rect x="-65" y="-7" width="20" height="14" rx="2"/>
      <rect x="45"  y="-7" width="20" height="14" rx="2"/>
    </g>
  </g>
  <!-- Text -->
  <text x="100" y="72"  text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" letter-spacing="1" fill="#d0d0d0">CRESWICK</text>
  <text x="100" y="96"  text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" letter-spacing="1" fill="#d0d0d0">RAILWAY</text>
  <text x="100" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" letter-spacing="1" fill="#d0d0d0">WORKSHOPS</text>
  <line x1="40" y1="133" x2="160" y2="133" stroke="#888" stroke-width="0.75"/>
  <text x="100" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" letter-spacing="1.5" fill="#999">ON TRACK FOR THE FUTURE</text>
</svg>
